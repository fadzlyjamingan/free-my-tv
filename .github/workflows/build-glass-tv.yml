name: Build Glass TV APK

on:
  push:
    paths:
      - '.github/workflows/build-glass-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Glass TV Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Download official Glass TV source
        uses: actions/checkout@v4
        with:
          repository: cocombee/glass-tv
          ref: main
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Glass TV
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Prepare APK
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk GlassTV.apk
          sha256sum GlassTV.apk

      - name: Upload Glass TV APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-APK
          path: GlassTV.apk
          if-no-files-found: error
          retention-days: 7
