
name: Build Free My TV Android 8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Android 8 source code
        uses: actions/checkout@v4
        with:
          repository: og-ever/free-my-tv
          ref: b5c4099c461a19865319196d6834c592632ae314

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Malaysia
        run: |
          cp config.example.properties config.properties
          cat >> config.properties <<'EOF'
          tmdb_region=MY
          currency=MYR
          temperature=C
          city=Kuala Lumpur
          latitude=3.1390
          longitude=101.6869
          EOF

      - name: Build Android 8 APK
        run: bash build.sh

      - name: Verify Android 8 compatibility
        run: |
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging FreeMyTV.apk | grep sdkVersion

      - name: Upload Android 8 APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Android8
          path: FreeMyTV.apk
          retention-days: 7
